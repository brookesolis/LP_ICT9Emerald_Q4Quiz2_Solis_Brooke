<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <title>Quiz</title>
  <style>
    body {
      background: linear-gradient(125deg, #2c3e54, #34495e);
      height: 100vh;
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      color: #ecf0f1;
      text-align: center;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 500px;
      color: #2c3e50;
      margin: 20px auto;
    }

    .English2-container,
    .math-container,
    .science-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 550px;
      margin: 20px auto;
      color: #2c3e50;
    }

    .English2-image { width: 95%; max-width: 330px; }
    .math-image { width: 75%; max-width: 230px; }
    .science-image { width: 90%; max-width: 300px; }

    .btn-custom {
      background-color: #2980b9;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    #output {
      font-size: 18px;
      margin-top: 20px;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Score Analyzer 😛</h1>
    <p><em>Enter your grades in the following subjects.</em></p>
  </div>

  <!-- English Input -->
  <div class="English2-container">
    <img src="english2.jpg" alt="English2" class="English2-image">
    <input type="number" id="English2" placeholder="Enter English Grade">
  </div>

  <!-- Math Input -->
  <div class="math-container">
    <img src="math.jpg" alt="Math" class="math-image">
    <input type="number" id="math" placeholder="Enter Math Grade">
  </div>

  <!-- Science Input -->
  <div class="science-container">
    <img src="science.avif" alt="Science" class="science-image">
    <input type="number" id="science" placeholder="Enter Science Grade">
  </div>

  <button type="button" class="btn-custom" onclick="computeAverage()">Get Rating</button>

  <div id="output"></div>

  <p><em>Note: Grading Criteria and Equivalents can vary depending on school or district.</em></p>

  <script>
    function computeAverage() {
      let english = parseFloat(document.getElementById("English2").value);
      let math = parseFloat(document.getElementById("math").value);
      let science = parseFloat(document.getElementById("science").value);

      if (isNaN(english) || isNaN(math) || isNaN(science)) {
        document.getElementById("output").innerHTML = "Please enter all grades.";
        return;
      }

      let average = (english + math + science) / 3;
      let rating = "";

      switch (true) {
        case (average >= 94 && average <= 100):
          rating = "Excellent";
          break;
        case (average >= 87):
          rating = "Above Satisfactory";
          break;
        case (average >= 80):
          rating = "Satisfactory";
          break;
        case (average >= 75):
          rating = "Needs Improvement";
          break;
        case (average >= 70):
          rating = "Poor";
          break;
        default:
          rating = "Invalid average";
      }

      document.getElementById("output").innerHTML = 
        `Average Grade: <strong>${average.toFixed(2)}</strong><br>Rating: <strong>${rating}</strong>`;
    }
  </script>
</body>
</html>
